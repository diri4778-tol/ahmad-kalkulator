<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}

.calculator {
  width: 360px;
  padding: 20px;
  border-radius: 30px;
  background: #000;
}

#display {
  width: 100%;
  height: 90px;
  background: #000;
  border: none;
  outline: none;
  color: white;
  font-size: 42px;
  text-align: right;
  padding-right: 10px;
  margin-bottom: 18px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

button {
  width: 74px;
  height: 74px;
  border: none;
  border-radius: 50%;
  font-size: 30px;
  cursor: pointer;
  color: white;
  background: #111;
  transition: 0.15s ease;
}

button:hover {
  transform: scale(1.04);
}

button:active {
  transform: scale(0.95);
}

.operator {
  background: #081633;
  color: #4c6fff;
}

.equal {
  background: #4c6fff;
  color: white;
}

  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" value="0" readonly><div class="buttons">
  <button class="operator" onclick="clearDisplay()">AC</button>
  <button class="operator" onclick="deleteLast()">⌫</button>
  <button class="operator" onclick="toggleSign()">+/-</button>
  <button class="operator" onclick="appendValue('/')">÷</button>

  <button onclick="appendValue('7')">7</button>
  <button onclick="appendValue('8')">8</button>
  <button onclick="appendValue('9')">9</button>
  <button class="operator" onclick="appendValue('*')">×</button>

  <button onclick="appendValue('4')">4</button>
  <button onclick="appendValue('5')">5</button>
  <button onclick="appendValue('6')">6</button>
  <button class="operator" onclick="appendValue('-')">−</button>

  <button onclick="appendValue('1')">1</button>
  <button onclick="appendValue('2')">2</button>
  <button onclick="appendValue('3')">3</button>
  <button class="operator" onclick="appendValue('+')">+</button>

  <button onclick="appendPercent()">%</button>
  <button onclick="appendValue('0')">0</button>
  <button onclick="appendValue('.')">,</button>
  <button class="equal" onclick="calculate()">=</button>
</div>

  </div>  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      if (display.value === '0' && value !== '.') {
        display.value = value;
      } else {
        display.value += value;
      }
    }

    function clearDisplay() {
      display.value = '0';
    }

    function deleteLast() {
      if (display.value.length <= 1) {
        display.value = '0';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function toggleSign() {
      if (display.value !== '0') {
        display.value = String(parseFloat(display.value) * -1);
      }
    }

    function appendPercent() {
      try {
        display.value = String(parseFloat(display.value) / 100);
      } catch {
        display.value = '0';
      }
    }

    function calculate() {
      try {
        const result = eval(display.value);
        display.value = Number.isFinite(result)
          ? parseFloat(result.toFixed(10)).toString()
          : '0';
      } catch {
        display.value = '0';
      }
    }
  </script></body>
</html>
